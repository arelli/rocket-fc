<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 1244 864" class="schem"><rect x="-2" y="-2" width="100%" height="100%" fill="#ffffff"/><style>
.card{fill:#fbfcfc;stroke:#c9d2d6;stroke-width:1}
