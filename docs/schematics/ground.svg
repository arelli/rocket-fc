<text class="note" x="14" y="296" text-anchor="start">fast = radio failed. CONNECTED: on while frames arrive,</text>
<text class="note" x="14" y="312" text-anchor="start">off for an instant at each frame. Both alternate: eject button</text>
<text class="note" x="14" y="328" text-anchor="start">enabled; both blink together: ejection in progress.</text>
