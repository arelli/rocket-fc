<text class="note" x="14" y="236" text-anchor="start">Short press: ping. Hold 1.5 s: search mode.</text>
<text class="note" x="14" y="252" text-anchor="start">Hold 3 s: manual ejection, only within</text>
<text class="note" x="14" y="268" text-anchor="start">60 s after &quot;Enable station button&quot; (UI).</text>
</g>
