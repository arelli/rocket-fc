<text class="note" x="14" y="330" text-anchor="start">Reports volts and % (# battery, UI: Radio link → Ground station).</text>
<text class="note" x="14" y="346" text-anchor="start">On USB the reading is the charger voltage. No cell: leave out R1/R2.</text>
<text class="note" x="14" y="362" text-anchor="start">No automatic cutoff: switch off when LOW (ON LED double-blinks).</text>
</g>
