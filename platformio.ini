; Rocket flight computer: Seeed XIAO ESP32-S3 + Wio-SX1262 (LoRa),
; MPU9250 IMU, BMP280 barometer, pyro channel, status LED, buzzer.
;
; Environments
;   flight   flight computer firmware              pio run -e flight -t upload
;   ground   ground station receiver (2nd kit)     pio run -e ground -t upload
;   bench    flight firmware + bench-only commands (simulated flight, test fire)
;   native   unit tests on your PC                 pio test -e native
;
; Every version below is pinned so that a given git commit always builds the
; same firmware.

[platformio]
default_envs = flight

[esp32_base]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra
lib_deps =
    jgromes/RadioLib@7.1.2
extra_scripts = pre:tools/build_info.py

[env:flight]
extends = esp32_base
build_src_filter = +<flight/>

[env:bench]
extends = esp32_base
build_src_filter = +<flight/>
build_flags =
    ${esp32_base.build_flags}
    -DFC_BENCH_BUILD=1

[env:ground]
extends = esp32_base
build_src_filter = +<ground/>

[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -Werror
lib_ignore = fc_hal
test_framework = unity
