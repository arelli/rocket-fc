; Rocket flight computer: Seeed XIAO ESP32-S3 + Wio-SX1262 (LoRa),
; MPU9250 IMU, BMP280 barometer, pyro channel, status LED, buzzer.
;
; Environments
;   flight   flight computer firmware              pio run -e flight -t upload
;            (one firmware for bench and flight: test commands need bench
;            mode, switched on at run time and off at every boot)
;   ground   ground station (2nd kit)              pio run -e ground -t upload
;   native   unit tests on your PC                 pio test -e native
;
; Every version below is pinned so that a given git commit always builds the
; same firmware.

[platformio]
default_envs = flight

[esp32_base]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; The board definition already enables USB-CDC serial and the 8 MB PSRAM.
; C++17 everywhere, same as the native unit tests.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
lib_deps =
    jgromes/RadioLib@7.1.2
extra_scripts = pre:tools/build_info.py

[env:flight]
extends = esp32_base
build_src_filter = +<flight/>
; Persistent flight log partition ("flog"); settings (nvs) stay where they were.
board_build.partitions = partitions_flight.csv

[env:ground]
extends = esp32_base
build_src_filter = +<ground/>

[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -Werror -Iinclude
lib_ignore = fc_hal
test_framework = unity
